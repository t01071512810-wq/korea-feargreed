name: 지수 갱신

on:
  # 제시간 실행은 cron-job.org가 workflow_dispatch를 호출한다(평일 16:30, 화~토 08:30 KST).
  # GitHub 예약 실행은 7~9시간씩 늦게 돌아서, 외부 서비스가 멈출 때를 대비한 안전장치로만 둔다.
  schedule:
    - cron: "30 7 * * 1-5"   # 평일 16:30 KST 예약 (실제로는 자정 이후 시작)
    - cron: "30 23 * * 1-5"  # 화~토 08:30 KST 예약 (실제로는 정오 무렵 시작)
  workflow_dispatch:

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 예약 실행은 늦게 시작될 수 있어, 예약된 시점이 아니라 지금의 main 최신 커밋에서 출발한다
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # 종목별 일봉 캐시(data/prices)는 저장소에 올리지 않고 Actions 캐시로 이어 쓴다
      - uses: actions/cache@v4
        with:
          path: data/prices
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - run: python build.py
        env:
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}

      - name: 결과 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json docs/og.png docs/index.html data/krx_daily.csv
          git diff --cached --quiet && exit 0
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          # 그사이 다른 커밋이 올라왔으면 그 위에 이번 결과를 얹는다(겹치는 파일은 이번 결과로)
          git push || { git pull --rebase -X theirs origin main && git push; }
